name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kim-n-kang/manyak-web

jobs:
  docker:
    name: Test and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=dev,enable=${{ github.event_name == 'push' }}
            type=sha,format=short,prefix=,enable=${{ github.event_name == 'push' }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # 이 이미지는 배포가 아니라 manyak-infra Compose의 로컬·통합 테스트에만 쓴다.
          # arm64는 amd64 러너에서 QEMU 에뮬레이션으로 빌드해야 하는데, Next 빌드 워커가
          # SIGILL로 죽는 일이 있고(binfmt가 latest라 버전이 고정되지 않는다) 빌드 시간의
          # 대부분을 차지한다. 맥에서는 amd64 이미지를 Rosetta로 실행한다(KNK-758).
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
