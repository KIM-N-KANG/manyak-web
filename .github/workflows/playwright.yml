name: Playwright Tests
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # 비주얼 회귀 기준 이미지를 만드는 환경(scripts/update-visual-snapshots.sh)과
    # 동일한 컨테이너에서 실행해야 스크린샷 비교가 폰트 렌더링 차이로 깨지지 않는다.
    # 브라우저가 이미지에 포함되어 있어 별도 playwright install 단계도 필요 없다.
    # 태그는 package.json의 @playwright/test 버전과 반드시 맞춘다.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          # webServer가 CI에서 `pnpm build && pnpm start`로 실행되며, NEXT_PUBLIC_ 값은
          # 빌드 시점에 인라인된다. E2E가 카카오 SDK를 스텁하므로 실제 키는 불필요하고,
          # isReady 배선을 활성화할 truthy 더미 값만 있으면 된다(use-kakao-share.ts 참고).
          NEXT_PUBLIC_KAKAO_JS_KEY: test-kakao-key
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
